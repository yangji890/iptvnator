<button mat-icon-button [matMenuTriggerFor]="langMenu" [title]="'SETTINGS.LANGUAGE' | translate">
  <mat-icon>language</mat-icon>
  <span class="current-lang-code">{{ currentLanguage.toUpperCase() }}</span>
</button>
<mat-menu #langMenu="matMenu">
  @for (lang of availableLanguages; track lang.code) {
    <button mat-menu-item (click)="switchLanguage(lang.code)">
      <span>{{ lang.name }}</span>
      @if (lang.code === currentLanguage) {
        <ng-container> <!-- Using ng-container as suggested by the warning -->
            <mat-icon class="selected-check" aria-label="Selected language">check</mat-icon>
        </ng-container>
      }
    </button>
  }
</mat-menu>
