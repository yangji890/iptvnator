<div class="main-container">
  <div class="top-bar">
    <div class="search-bar-container">
      <mat-form-field appearance="outline" class="global-search-field">
        <mat-label>{{ 'GENERAL.SEARCH' | translate }}</mat-label>
        <input matInput (input)="onSearch($event)" placeholder="{{ 'XTREAM.SEARCH_PLACEHOLDER' | translate }}">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
    <div class="language-switcher-container">
      <app-language-switcher></app-language-switcher>
    </div>
  </div>

  <div class="content-area">
    <div class="content-header">
      <h2>
        @if (xtreamStore.selectedItem()) {
          <button mat-icon-button (click)="historyBack()">
            <mat-icon>chevron_left</mat-icon>
          </button>
        }
        {{ getContentLabel() }}
      </h2>
    </div>
    <div class="scrollable-content">
      <router-outlet />
    </div>
  </div>

  <div class="bottom-navigation">
    <app-category-view
      [items]="categories()"
      [selectedCategoryId]="selectedCategoryId()"
      (categoryClicked)="categoryClicked($event)"
      layout="horizontal"
    />
  </div>
  <app-mpv-player-bar />
</div>
